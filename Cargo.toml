[package]
name = "bench"
version = "0.1.0"
edition = "2024"

[dependencies]
bench_ui = { path = "crates/ui" }
protocol = { path = "crates/protocol" }
thread = { path = "crates/thread" }
devtools = { path = "crates/devtools" }
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tungstenite = "0.30"
async-channel = "2"
anyhow = "1"
# The SSH terminal: VT parsing + grid (Apache-2.0) and the PTY ssh runs in.
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac", "symphonia-vorbis", "symphonia-isomp4", "symphonia-aac"] }
imagesize = "0.13"
# LaTeX as Unicode text and Mermaid as SVG: pure Rust, no browser.
unicodeit = "0.2"
mermaid-rs-renderer = { version = "0.3", default-features = false }
# The same image crate gpui decodes with: video frames are handed to it as RenderImages.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
regex = "1"
chrono = "0.4"
# Time that works in the browser build too (std's Instant/SystemTime panic there; on the desktop
# this is std's).
web-time = "1"
sha2 = "0.10"
percent-encoding = "2"

[workspace]
members = [".", "crates/*"]

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

# macOS only: "the agent finished" is a system notification (src/notify.rs); elsewhere
# src/notify_other.rs stands in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDate", "NSError", "NSPredicate", "NSCalendar", "NSObject", "NSURL", "NSTimeZone"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# Desktop only: the syntax grammars (C code), HTTP with TLS, the terminal (a PTY and a VT parser).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-kit = { version = "0.8.0", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-html", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-go", "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-swift", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-lua", "tree-sitter-sql", "tree-sitter-make", "tree-sitter-cmake", "tree-sitter-diff", "tree-sitter-csharp", "tree-sitter-scala", "tree-sitter-zig", "tree-sitter-graphql", "tree-sitter-proto", "tree-sitter-elixir", "tree-sitter-erb", "tree-sitter-ejs", "tree-sitter-svelte", "tree-sitter-astro"] }
ureq = { version = "2.12", features = ["json"] }
# wss:// (the server browser's gateway): rustls does not build for the browser.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"

# The browser build (the demo, web/): HTTP without TLS (nothing is fetched), random numbers from
# the browser.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui-kit = "0.8.0"
chrono = { version = "0.4", features = ["wasmbind"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# GPUI's web backend runs single-threaded here: its threads need nightly Rust and server headers
# that GitHub Pages can't send. Two crates with that one default changed, nothing else.
[patch.crates-io]
gpui-pre-web = { path = "vendor/gpui-pre-web" }
gpui-pre-platform = { path = "vendor/gpui-pre-platform" }
# The text caret 2px wide (1px upstream), as Zed draws it: one constant changed.
gpui-base = { path = "vendor/gpui-base" }
