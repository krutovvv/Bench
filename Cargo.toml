[package]
name = "hermes-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.8.0", features = ["tree-sitter", "tree-sitter-yaml", "tree-sitter-markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tungstenite = "0.30"
ureq = { version = "2.12", features = ["json"] }
async-channel = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-wav"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
