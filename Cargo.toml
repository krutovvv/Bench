[package]
name = "hermes-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
similar = "2"
gpui-kit = { version = "0.8.0", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-html", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-go", "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-swift", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-toml", "tree-sitter-yaml", "tree-sitter-markdown", "tree-sitter-lua"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tungstenite = "0.30"
ureq = { version = "2.12", features = ["json"] }
async-channel = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
cpal = "0.15"
hound = "3.5"
rodio = { version = "0.20", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "symphonia-flac", "symphonia-vorbis", "symphonia-isomp4", "symphonia-aac"] }
imagesize = "0.13"
# LaTeX as Unicode text and Mermaid as SVG: pure Rust, no browser.
unicodeit = "0.2"
mermaid-rs-renderer = { version = "0.3", default-features = false }
# The same image crate gpui decodes with: video frames are handed to it as RenderImages.
image = { version = "0.25", default-features = false }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
