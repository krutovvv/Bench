[package]
name = "protocol"
version = "0.1.0"
edition = "2024"
description = "The wire between Bench and its agent: requests, events, a thread as the agent tells it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-json-impl", "no-serde-warnings"] }
