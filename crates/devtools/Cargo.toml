[package]
name = "devtools"
version = "0.1.0"
edition = "2024"
description = "The /tools utilities as pure functions: encoders, converters, generators, parsers, rich text to Markdown"

[dependencies]
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
croner = "4"
heck = "0.5"
htmd = "0.5"
md-5 = "0.10"
percent-encoding = "2"
rand = "0.8"
regex = "1"
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
